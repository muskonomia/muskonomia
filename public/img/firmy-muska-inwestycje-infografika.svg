  <text x="64" y="168" fill="#111111" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">W tym roku</text>
  <line x1="64" y1="184" x2="1016" y2="184" stroke="#111111" stroke-width="1"/>
  <text x="64" y="232" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">SpaceX (z xAI i X): ok. 65 mld USD</text>
