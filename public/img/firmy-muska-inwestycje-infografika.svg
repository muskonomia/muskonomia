  <line x1="64" y1="460" x2="1016" y2="460" stroke="#111111" stroke-width="1"/>
  <text x="64" y="512" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Starbase Louisiana: do 100 mld USD</text>
