  <text x="64" y="616" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Fort Bend (ogniwa słoneczne): 10 mld USD</text>
  <text x="64" y="668" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Southaven (centrum danych xAI): ponad 20 mld USD</text>
  <text x="64" y="760" fill="#111111" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Do 2030 r.</text>
  <line x1="64" y1="776" x2="1016" y2="776" stroke="#111111" stroke-width="1"/>
  <text x="64" y="828" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">w obecnym tempie: ok. 450 mld USD</text>
  <rect x="48" y="856" width="984" height="64" rx="6" fill="#111111"/>
  <text x="64" y="898" fill="#f3f0e8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">z dużymi projektami: ok. 680 mld USD</text>
