<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" role="img" aria-label="Inwestycje firm Elona Muska w tym roku i ogłoszone megaprojekty">
  <rect width="1080" height="980" fill="#f3f0e8"/>
  <rect x="0" y="0" width="1080" height="8" fill="#111111"/>
